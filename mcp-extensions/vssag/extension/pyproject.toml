[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ownmindforge-vssag"
version = "0.1.0.dev0"
description = "OwnMindForge VSSAG generic document parsing and retrieval SDK"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.0",
  "ruamel-yaml>=0.18.0",
  "json-repair>=0.30.0",
  "httpx>=0.26.0",
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.21",
]

[project.scripts]
vssag-sql-collect = "vssag.sql_collect:main"

[project.optional-dependencies]
providers = [
  "openai>=1.40.0",
  "langfuse>=3.0.0",
]
pgvector = [
  "asyncpg>=0.29.0",
]
sql = [
  "asyncpg>=0.29.0",
  "aiomysql>=0.2.0",
]
cdc = [
  "asyncpg>=0.29.0",
  "aiomysql>=0.2.0",
  "aiokafka>=0.12.0",
  "redis>=5.0.0",
  "mysql-replication>=1.0.9",
]
lancedb = [
  "lancedb>=0.15.0",
  "pyarrow>=16.0.0",
]
mcp = [
  "fastmcp>=3.0.0",
]
all = [
  "openai>=1.40.0",
  "langfuse>=3.0.0",
  "asyncpg>=0.29.0",
  "aiomysql>=0.2.0",
  "aiokafka>=0.12.0",
  "redis>=5.0.0",
  "mysql-replication>=1.0.9",
  "lancedb>=0.15.0",
  "pyarrow>=16.0.0",
  "fastmcp>=3.0.0",
]

[tool.setuptools.package-data]
vssag = ["prompts/*.md"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["vssag*"]
