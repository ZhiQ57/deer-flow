[project]
name = "deerflow-mcp-sql-execute"
version = "0.1.0"
description = "External read-only SQL execution MCP server for DeerFlow"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20.0,<2",
    "pymysql>=1.1.1",
    "psycopg[binary]>=3.3.3",
    "pyyaml>=6.0.3",
    "sqlglot>=27.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
