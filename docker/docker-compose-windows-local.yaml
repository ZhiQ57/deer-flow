# Windows Docker Desktop 本地开发：中间件运行在容器中，Gateway 与前端运行在宿主机。
name: deerflow-dev

services:
  postgres:
    image: postgres:15
    container_name: deerflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在根目录 .env 配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 配置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在根目录 .env 配置 POSTGRES_DB}
    ports:
      - "127.0.0.1:7432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: deer-flow-redis
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:latest
    container_name: deer-flow-nginx-host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:2026:2026"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.local.template:ro
    # 沿用现有代理规则，只替换容器日志路径和 Windows 宿主机端口。
    command:
      - /bin/sh
      - -ec
      - |
        sed -e 's#logs/nginx-error.log#/dev/stderr#g' \
            -e 's#logs/nginx-access.log#/dev/stdout#g' \
            -e 's#logs/nginx.pid#/tmp/nginx.pid#g' \
            -e 's#127.0.0.1:8001#host.docker.internal:7001#g' \
            -e 's#127.0.0.1:3000#host.docker.internal:7000#g' \
            /etc/nginx/nginx.local.template > /tmp/nginx.conf
        nginx -t -c /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'

volumes:
  postgres_data:
    external: true
    name: deerflow-dev-postgres-data
  redis_data:
    external: true
    name: deer-flow-redis-data
