config_version: 43
log_level: info
logging:
  enhance:
    enabled: false
    format: text
token_usage:
  enabled: true
token_budget:
  enabled: false
  max_tokens: 200000
  max_input_tokens: null
  max_output_tokens: null
  warn_threshold: 0.8
  hard_stop_threshold: 1.0
max_recursion_limit: 1000
models:
- name: Hy4-WorkBuddy-Free
  display_name: Hy4-WorkBuddy-Free
  use: deerflow.models.qwen_provider:QwenChatModel
  model: workbuddy-ai/hy4free
  api_base: http://127.0.0.1:3425/v1
  api_key: magpie
  timeout: 600.0
  max_retries: 2
  enable_prompt_caching: true
  prompt_cache_ttl: 5m
  supports_thinking: true
  supports_vision: true
  supports_reasoning_effort: true
  when_thinking_enabled:
    extra_body:
      thinking:
        type: enabled
  when_thinking_disabled:
    extra_body:
      thinking:
        type: disabled
