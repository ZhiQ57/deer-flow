name: data-agent
description: 面向 Text2SQL / NL2SQL 的专业数据分析智能体.
model: 使用 Qwen / Deepseek / glm 系列国产模型

# 排除系统默认的子智能体以外的子智能体列表，default 表示使用系统默认
allowable_subagents: 
  - default
  - sql-subagent

# 工具列表
tool_groups:
  - web
  - file:read
  - file:write
  - bash

# Skill 列表
skills:
  - table-rag-agent
  - data-analysis
  - chart-visualization

# 业务能力：表示正式 DataAgent 能力，例如：PostgreSQL 保存 TableRAG 索引，MySQL 执行业务 SQL.
service_ability:
  # 通用字段
  service_name: data-agent
  version: 1
  # 业务字段
  confirmation_mode: on_ambiguity       # 审批模式, on_ambiguity: 模糊时审批, always: 总是审批, never: 从不审批
  enable_subagent_sql_execution: true   # 是否允许子智能体执行 SQL
  allowed_type: readonly                # 允许的数据库访问类型, readonly: 只读, readwrite: 可读写
  execute_database: $EXECUTE_DATABASE_TYPE          # 环境变量读取执行数据库方言
  dsn_env: $DATA_AGENT_DSN

  type: data_query
  enable_sql_rag: true
  table_rag_config: tabelrag.yaml
  data_source_id: text2sql-mysql-local
  source_binding_mode: logical_data_source
  min_auto_confidence: 0.85
  sql_subagent_name: sql-subagent
  sql_execution:
    enabled: true
    database_type: mysql
    dsn_env: DATA_AGENT_MYSQL_DSN
    readonly: true
    statement_timeout_seconds: 10
    max_rows: 100
    max_cell_chars: 2000
    max_result_chars: 100000
    allowed_schemas:
      - text2sql
