name: data-agent
description: 面向 Text2SQL / NL2SQL 的专业数据分析智能体.
model: 使用 Qwen / Deepseek / glm 系列国产模型

# 排除系统默认的子智能体以外的子智能体列表，default 表示使用系统默认
allowable_subagents: 
  - default
  - sql-subagent
# Lead-Agent 只检索表结构；SQL 执行权交给显式配置的 sql-subagent。
mcp_tools:
  - sqlrag_retrieve

# 工具列表
tool_groups:
  - web
  - file:read
  - file:write
  - bash

# Skill 列表
skills:
  - table-rag-agent
  - data-analysis
  - chart-visualization

# 手动 SQL 执行按钮仍通过 Gateway 路由执行；模型和子代理执行 SQL
# 继续通过外部 MCP 的 sql_execute，不会由 service_ability 注入 AgentLoop。
service_ability:
  type: data_query
  version: 1
  enable_sql_rag: true
  table_rag_config: tablerag.yaml
  data_source_id: text2sql-mysql-local
  source_binding_mode: logical_data_source
  confirmation_mode: always
  sql_subagent_name: sql-subagent
  sql_execution:
    enabled: true
    database_type: mysql
    dsn_env: DATA_AGENT_MYSQL_DSN
    readonly: true
    statement_timeout_seconds: 10
    max_rows: 100
    max_cell_chars: 2000
    max_result_chars: 100000
    allowed_schemas:
      - text2sql
