name: clinical-desision-agent
description: 面向辅助生殖临床场景的 AI 临床诊断助手(AI Clinical Assistant), 提供临床信息获取、医学研究、患者数据理解、文档整理、临床沟通支持、知识检索等工作
model: 使用 Qwen / Deepseek / glm 系列国产模型

# 使用的子智能体列表，default 表示使用系统默认, 可以定制化设计.
allowable_subagents: 
  - default

# 工具列表
tool_groups:
  - web
  - file:read
  - file:write
  - bash

# Skill 列表
skills:
  - table-rag-agent
  - data-analysis
  - chart-visualization
  - fertility-evidence-reasoning

# SubAgent 配置项
